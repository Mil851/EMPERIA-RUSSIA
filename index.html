<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EMPERIA RP</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f12;
            --card-bg: #16191f;
            --border: #222731;
            --accent: #00cc99;
            --accent-hover: #33ffa9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Geist', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 80px 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
        }
        .logo span {
            color: var(--accent);
        }
        .balance-badge {
            background: #192724;
            border: 1px solid #1f3d35;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: var(--text-muted);
        }
        .info-value {
            font-weight: 500;
            color: #fff;
        }
        .btn {
            background: var(--accent);
            color: #080a0d;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            width: 100%;
            display: block;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: #111318;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            background: none;
            border: none;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">EMPERIA<span>RP</span></div>
        <div class="balance-badge" id="balance-display">0 $</div>
    </div>

    <div id="screen-profile" class="screen active">
        <div class="card">
            <div class="card-title">Паспорт гражданина</div>
            <div class="info-row">
                <div class="info-label">Имя</div>
                <div class="info-value">Emperian_Player</div>
            </div>
            <div class="info-row">
                <div class="info-label">Статус</div>
                <div class="info-value" style="color: #ff3366;">Обычный игрок</div>
            </div>
            <div class="info-row">
                <div class="info-label">Транспорт</div>
                <div class="info-value" id="car-display">Отсутствует</div>
            </div>
        </div>
    </div>

    <div id="screen-job" class="screen">
        <div class="card">
            <div class="card-title">Текущая подработка</div>
            <div class="info-row">
                <div class="info-label">Профессия</div>
                <div class="info-value">Шахтер (Уровень 1)</div>
            </div>
            <div class="info-row">
                <div class="info-label">Плата за клик</div>
                <div class="info-value" style="color: var(--accent);">+150 $</div>
            </div>
        </div>
        <button class="btn" onclick="mineRuby()">Добывать руду ⛏️</button>
    </div>

    <div id="screen-shop" class="screen">
        <div class="card">
            <div class="card-title">Низкий класс</div>
            <div class="info-row">
                <div class="info-label">VAZ 2107</div>
                <div class="info-value">15 000 $</div>
            </div>
            <button class="btn" style="margin-top: 10px; padding: 10px;" onclick="buyVehicle('VAZ 2107', 15000)">Купить</button>
        </div>
        <div class="card">
            <div class="card-title">Средний класс</div>
            <div class="info-row">
                <div class="info-label">BMW M5 E60</div>
                <div class="info-value">120 000 $</div>
            </div>
            <button class="btn" style="margin-top: 10px; padding: 10px;" onclick="buyVehicle('BMW M5 E60', 120000)">Купить</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchScreen('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            Профиль
        </button>
        <button class="nav-item" onclick="switchScreen('job', this)">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            Работа
        </button>
        <button class="nav-item" onclick="switchScreen('shop', this)">
            <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Машины
        </button>
    </div>

    <script>
        let userData = { balance: 0, car: "Отсутствует" };
        function updateUI() {
            document.getElementById('balance-display').innerText = userData.balance.toLocaleString() + ' $';
            document.getElementById('car-display').innerText = userData.car;
        }
        function switchScreen(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
            element.classList.add('active');
        }
        function mineRuby() {
            userData.balance += 150;
            updateUI();
        }
        function buyVehicle(carName, price) {
            if (userData.balance >= price) {
                if(userData.car === carName) { return alert("У вас уже есть это авто!"); }
                userData.balance -= price;
                userData.car = carName;
                updateUI();
                alert(`Успешная покупка: ${carName}`);
            } else {
                alert("Недостаточно денег!");
            }
        }
    </script>
</body>
</html>
